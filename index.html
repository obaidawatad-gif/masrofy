function makeIcon(glyph) {
  return function Icon({ size = 16, color, style, strokeWidth, ...rest }) {
    return (
      <span
        style={{
          fontSize: size,
          lineHeight: 1,
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          width: size,
          height: size,
          ...style,
        }}
        {...rest}
      >
        {glyph}
      </span>
    );
  };
}

  const [editRecDay, setEditRecDay] = useState("");
  const [editRecMonth, setEditRecMonth] = useState("1");
  const [editRecFrequency, setEditRecFrequency] = useState("monthly");
  const [editRecNote, setEditRecNote] = useState("");
  const [editRecCat, setEditRecCat] = useState("home");
  const [income, setIncome] = useState(6000); // الدخل الشهري الثابت (الراتب)
  const [editingIncome, setEditingIncome] = useState(false);
  const [incomeInput, setIncomeInput] = useState("6000");
  const [extraIncomes, setExtraIncomes] = useState([
    { id: 1, source: "عمل حر", amount: 300 },

  const [addingExtra, setAddingExtra] = useState(false);
  const [extraSourceInput, setExtraSourceInput] = useState("");

  const [goal, setGoal] = useState({ name: "شراء طابعة", target: 800, saved: 150, monthlyTarget: 100 });
  const [chartTab, setChartTab] = useState("month");
  const [debts, setDebts] = useState(SEED_DEBTS);

  const [debtPerson, setDebtPerson] = useState("");
  const [debtAmount, setDebtAmount] = useState("");
  const [debtDirection, setDebtDirection] = useState("owe");
  const nextDebtId = useRef(10);
  const [editingDebtId, setEditingDebtId] = useState(null);
  const [editDebtPerson, setEditDebtPerson] = useState("");
  const [editDebtAmount, setEditDebtAmount] = useState("");
  const [editDebtDirection, setEditDebtDirection] = useState("owe");

  const [openGoal, setOpenGoal] = useState(false);

  const nextId = useRef(10);

  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const streamRef = useRef(null);

  const missingPhoto = txns.filter((t) => !t.hasPhoto);

  function isRecurringOverdue(r) {
    if (r.paid) return false;
    if (r.frequency === "monthly") return r.dueDay < TODAY;
    if (r.frequency === "yearly") {
      return r.dueMonth < TODAY_MONTH || (r.dueMonth === TODAY_MONTH && r.dueDay < TODAY);
    }
    return false; // "أخرى" لا تُحسب تلقائياً كمتأخرة
  }

  const overdue = recurring.filter((r) => !r.paid && isRecurringOverdue(r));
  const upcoming = recurring.filter((r) => !r.paid && !isRecurringOverdue(r));

  function markPaid(id) {
    setRecurring((prev) =>
      prev.map((r) => (r.id === id ? { ...r, paid: true } : r))
    );
    const item = recurring.find((r) => r.id === id);
    if (item) {
      setTxns((prev) => [
        {
          id: nextId.current++,
          cat: item.cat,
          label: item.label,
          amount: item.amount,
          hasPhoto: false,
          place: "",
          date: TODAY_DATE_LABEL,
        },
        ...prev,
      ]);
    }
  }

  function addRecurring() {
    if (!newLabel || !newAmount) return;
    if (newFrequency === "monthly" && !newDay) return;
    if (newFrequency === "yearly" && (!newDay || !newMonth)) return;
    if (newFrequency === "other" && !newNote) return;
    setRecurring((prev) => [
      ...prev,
      {
        id: nextRecId.current++,
        label: newLabel,
        cat: newCat,
        amount: Number(newAmount),
        frequency: newFrequency,
        dueDay: newFrequency !== "other" ? Number(newDay) : null,
        dueMonth: newFrequency === "yearly" ? Number(newMonth) : null,
        note: newFrequency === "other" ? newNote : "",
        paid: false,
      },
    ]);
    setNewLabel("");
    setNewAmount("");
    setNewDay("");
    setNewMonth("1");
    setNewFrequency("monthly");
    setNewNote("");
    setNewCat("home");
    setShowAddRecurring(false);
  }

  function deleteRecurring(id) {
    setRecurring((prev) => prev.filter((r) => r.id !== id));
    if (editingRecId === id) setEditingRecId(null);
  }

  function startEditRecurring(r) {
    setEditingRecId(r.id);
    setEditRecLabel(r.label);
    setEditRecAmount(String(r.amount));
    setEditRecCat(r.cat);
    setEditRecFrequency(r.frequency);
    setEditRecDay(r.dueDay ? String(r.dueDay) : "");
    setEditRecMonth(r.dueMonth ? String(r.dueMonth) : "1");
    setEditRecNote(r.note || "");
  }

  function saveEditRecurring(id) {
    const amt = Number(editRecAmount);
    if (!editRecLabel || isNaN(amt) || amt <= 0) return;
    if (editRecFrequency === "monthly" && !editRecDay) return;
    if (editRecFrequency === "yearly" && (!editRecDay || !editRecMonth)) return;
    if (editRecFrequency === "other" && !editRecNote) return;
    setRecurring((prev) =>
      prev.map((r) =>
        r.id === id
          ? {
              ...r,
              label: editRecLabel,
              amount: amt,
              cat: editRecCat,
              frequency: editRecFrequency,
              dueDay: editRecFrequency !== "other" ? Number(editRecDay) : null,
              dueMonth: editRecFrequency === "yearly" ? Number(editRecMonth) : null,
              note: editRecFrequency === "other" ? editRecNote : "",
            }
          : r
      )
    );
    setEditingRecId(null);
  }

  function randomCat() {
    return CAT_KEYS[Math.floor(Math.random() * CAT_KEYS.length)];
  }

  function handleCapture() {
    if (scanning) return;
    setScanning(true);
    setTimeout(() => {
      const cat = randomCat();
      const amount = Math.floor(20 + Math.random() * 180);
      const id = nextId.current++;
      setTxns((prev) => [
        {
          id,
          cat,
          label: `فاتورة ${CATS[cat].label}`,
          amount,
          hasPhoto: true,
          place: "",
          date: TODAY_DATE_LABEL,
        },
        ...prev,
      ]);
      setScanning(false);
      setFlash("photo");
      setEditingPlaceId(id);
      setPlaceInput("");
      setTimeout(() => setFlash(null), 1600);
    }, 1300);
  }

  function handleVoice() {
    if (recording) {
      // إيقاف التسجيل
      if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
        mediaRecorderRef.current.stop();
      }
      return;
    }

    setMicError(null);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicError("المتصفح لا يدعم الوصول للميكروفون هنا");
      return;
    }

    navigator.mediaDevices
      .getUserMedia({ audio: true })
      .then((stream) => {
        streamRef.current = stream;
        chunksRef.current = [];
        const mr = new MediaRecorder(stream);
        mediaRecorderRef.current = mr;

        mr.ondataavailable = (e) => {
          if (e.data.size > 0) chunksRef.current.push(e.data);
        };

        mr.onstop = () => {
          const blob = new Blob(chunksRef.current, { type: "audio/webm" });
          const audioUrl = URL.createObjectURL(blob);
          const cat = randomCat();
          const amount = Math.floor(10 + Math.random() * 90);
          const id = nextId.current++;
          setTxns((prev) => [
            {
              id,
              cat,
              label: `صرفت على ${CATS[cat].label}`,
              amount,
              hasPhoto: false,
              place: "",
              audioUrl,
              date: TODAY_DATE_LABEL,
            },
            ...prev,
          ]);
          setRecording(false);
          setFlash("voice");
          setEditingPlaceId(id);
          setPlaceInput("");
          setTimeout(() => setFlash(null), 1600);
          // إيقاف الميكروفون فعلياً
          stream.getTracks().forEach((t) => t.stop());
        };

        mr.start();
        setRecording(true);
      })
      .catch(() => {
        setMicError("ما قدرنا نوصل للميكروفون — تأكد من إعطاء الإذن");
      });
  }

  function savePlace(id) {
    setTxns((prev) =>
      prev.map((t) => (t.id === id ? { ...t, place: placeInput.trim() } : t))
    );
    setEditingPlaceId(null);
    setPlaceInput("");
  }

  function deleteTxn(id) {
    setTxns((prev) => prev.filter((t) => t.id !== id));
    if (editingTxnId === id) setEditingTxnId(null);
  }

  function startEditTxn(t) {
    setEditingTxnId(t.id);
    setEditTxnLabel(t.label);
    setEditTxnAmount(String(t.amount));
    setEditTxnCat(t.cat);
  }

  function saveEditTxn(id) {
    const amt = Number(editTxnAmount);
    if (!editTxnLabel || isNaN(amt) || amt <= 0) return;
    setTxns((prev) =>
      prev.map((t) => (t.id === id ? { ...t, label: editTxnLabel, amount: amt, cat: editTxnCat } : t))
    );
    setEditingTxnId(null);
  }

  function addManualTxn() {
    const amt = Number(manualAmount);
    if (!manualLabel || isNaN(amt) || amt <= 0) return;
    setTxns((prev) => [
      {
        id: nextId.current++,
        cat: manualCat,
        label: manualLabel,
        amount: amt,
        hasPhoto: false,
        place: manualPlace.trim(),
        date: TODAY_DATE_LABEL,
      },
      ...prev,
    ]);
    setManualLabel("");
    setManualAmount("");
    setManualCat("home");
    setManualPlace("");
    setShowManualAdd(false);
  }

  function saveGoal() {
    const t = Number(goalTargetInput);
    const mt = Number(goalMonthlyInput) || 0;
    if (!goalNameInput || isNaN(t) || t <= 0) return;
    setGoal((g) => ({ ...g, name: goalNameInput, target: t, monthlyTarget: mt }));
    setEditingGoal(false);
  }

  function deleteGoal() {
    setGoal({ name: "", target: 0, saved: 0, monthlyTarget: 0 });
    setEditingGoal(false);
  }

  function addContribution() {
    const v = Number(contribInput);
    if (isNaN(v) || v <= 0) return;
    setGoal((g) => ({ ...g, saved: g.saved + v }));
    setContribInput("");
  }

  function attachPhoto(id) {
    setTxns((prev) =>
      prev.map((t) => (t.id === id ? { ...t, hasPhoto: true } : t))
    );
  }

  const total = txns.reduce((s, t) => s + t.amount, 0);
  const extraTotal = extraIncomes.reduce((s, e) => s + e.amount, 0);
  const totalIncome = income + extraTotal;
  const remaining = totalIncome - total;
  const spentPct = totalIncome > 0 ? Math.min(100, (total / totalIncome) * 100) : 0;
  const barColor = spentPct > 90 ? "#FF3B30" : spentPct > 60 ? "#FFC93C" : "#00B37E";

  // متبقي بعد حسم الفواتير الاعتيادية الشهرية (بغض النظر عن باقي المصاريف)
  const recurringTotal = recurring.reduce((s, r) => s + r.amount, 0);
  const loansMonthlyTotal = loans.reduce((s, l) => s + l.monthlyPayment, 0);
  const loansOutstandingTotal = loans.reduce((s, l) => s + l.amount, 0);
  const remainingAfterBills = totalIncome - recurringTotal - loansMonthlyTotal;

  // الديون الشخصية
  const owedByMe = debts.filter((d) => d.direction === "owe" && !d.settled);
  const owedToMe = debts.filter((d) => d.direction === "owed" && !d.settled);
  const totalIOwe = owedByMe.reduce((s, d) => s + d.amount, 0);
  const totalOwedToMe = owedToMe.reduce((s, d) => s + d.amount, 0);
  const netDebt = totalOwedToMe - totalIOwe;

  function addDebt() {
    const v = Number(debtAmount);
    if (!debtPerson || isNaN(v) || v <= 0) return;
    setDebts((prev) => [
      ...prev,
      { id: nextDebtId.current++, person: debtPerson, amount: v, direction: debtDirection, settled: false },
    ]);
    setDebtPerson("");
    setDebtAmount("");
    setShowAddDebt(false);
  }

  function settleDebt(id) {
    setDebts((prev) => prev.map((d) => (d.id === id ? { ...d, settled: true } : d)));
  }

  function deleteDebt(id) {
    setDebts((prev) => prev.filter((d) => d.id !== id));
    if (editingDebtId === id) setEditingDebtId(null);
  }

  function startEditDebt(d) {
    setEditingDebtId(d.id);
    setEditDebtPerson(d.person);
    setEditDebtAmount(String(d.amount));
    setEditDebtDirection(d.direction);
  }

    const v = Number(editDebtAmount);

                  .filter((l) => !l.paid)

                      onDelete={deleteLoan}
                      isEditing={editingLoanId === l.id}
                      onStartEdit={startEditLoan}
                      onCancelEdit={() => setEditingLoanId(null)}
                      onSaveEdit={saveEditLoan}

                      setEditBank={setEditLoanBank}
                      editAmount={editLoanAmount}
                      setEditAmount={setEditLoanAmount}
                      editMonthly={editLoanMonthly}
                      setEditMonthly={setEditLoanMonthly}
                      editDay={editLoanDay}
                      setEditDay={setEditLoanDay}
                    />

                {loans
                  .filter((l) => l.paid)

                    <LoanRow
                      key={l.id}
                      l={l}
                      paid
                      onPay={payLoan}
                      onDelete={deleteLoan}
                      isEditing={editingLoanId === l.id}

                      onCancelEdit={() => setEditingLoanId(null)}
                      onSaveEdit={saveEditLoan}
                      editBank={editLoanBank}
                      setEditBank={setEditLoanBank}
                      editAmount={editLoanAmount}
                      setEditAmount={setEditLoanAmount}
                      editMonthly={editLoanMonthly}
                      setEditMonthly={setEditLoanMonthly}
                      editDay={editLoanDay}
                      setEditDay={setEditLoanDay}
                    />

                <div style={{ marginTop: 16 }}>
                  {!showAddLoan ? (
                    <button
                      onClick={() => setShowAddLoan(true)}
                      style={{
                        width: "100%",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        gap: 6,
                        background: "#111111",
                        color: "#fff",
                        border: "none",
                        borderRadius: 0,
                        padding: "10px",
                        fontSize: 13,
                        fontWeight: 700,
                      }}
                    >
                      <Plus size={15} /> إضافة قرض أو بطاقة جديدة
                    </button>
                  ) : (
                  <div
                    style={{
                      background: "#fff",
                      border: "1px solid #E5E5E5",

                    <button
                      onClick={() => setLoanType("loan")}
                      style={{
                        flex: 1,
                        background: loanType === "loan" ? "#111111" : "#F0F0F0",
                        color: loanType === "loan" ? "#fff" : "#6B6B6B",
                        border: "none",
                        borderRadius: 0,
                        padding: "8px",
                        fontSize: 12,
                        fontWeight: 700,
                      }}

                      قرض
                    </button>
                    <button
                      onClick={() => setLoanType("card")}
                      style={{
                        flex: 1,
                        background: loanType === "card" ? "#111111" : "#F0F0F0",
                        color: loanType === "card" ? "#fff" : "#6B6B6B",
                        border: "none",
                        borderRadius: 0,
                        padding: "8px",
                        fontSize: 12,
                        fontWeight: 700,

                      بطاقة ائتمان
                    </button>
                  </div>

                    <input
                      placeholder="اسم البنك (مثال: البنك الأهلي)"
                      value={loanBank}
                      onChange={(e) => setLoanBank(e.target.value)}
                      style={inputStyle}
                    />
                    <input
                      placeholder={loanType === "loan" ? "المبلغ المتبقي من القرض" : "المبلغ المستخدم من البطاقة"}
                      type="number"
                      value={loanAmount}
                      onChange={(e) => setLoanAmount(e.target.value)}

                    />
                    <div style={{ display: "flex", gap: 8 }}>
                      <input
                        placeholder="القسط/الحد الأدنى الشهري"
                        type="number"
                        value={loanMonthly}
                        onChange={(e) => setLoanMonthly(e.target.value)}
                        style={{ ...inputStyle, flex: 1 }}
                      />
                      <input
                        placeholder="يوم الاستحقاق (1-31)"
                        type="number"
                        min={1}
                        max={31}
                        value={loanDay}
                        onChange={(e) => setLoanDay(e.target.value)}
                        style={{ ...inputStyle, flex: 1 }}
                      />
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button
                        onClick={addLoan}
                        style={{
                          flex: 1,
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          gap: 6,
                          background: "#111111",
                          color: "#fff",
                          border: "none",
                          borderRadius: 0,
                          padding: "10px",
                          fontSize: 13,
                          fontWeight: 700,
                        }}
                      >
                        <Plus size={15} /> إضافة
                      </button>
                      <button
                        onClick={() => setShowAddLoan(false)}
                        style={{
                          flex: 1,
                          background: "#F0F0F0",
                          color: "#6B6B6B",
                          border: "none",
                          borderRadius: 0,
                          padding: "10px",
                          fontSize: 13,
                          fontWeight: 700,
                        }}
                      >
                        إلغاء
                      </button>

                  </div>
                  </div>
                  )}

                <div style={{ height: 20 }} />
              </div>
            </div>
          )}
        </div>

    </div>

}

const inputStyle = {
  border: "1px solid #E5E5E5",
  borderRadius: 0,
  padding: "9px 10px",
  fontSize: 13,
  fontFamily: "'Cairo', sans-serif",
  outline: "none",
  background: "#FFFFFF",
};

function DebtRow({
  d,
  settled,
  onSettle,
  onDelete,
  isEditing,
  onStartEdit,
  onCancelEdit,
  onSaveEdit,
  editPerson,
  setEditPerson,
  editAmount,
  setEditAmount,
  editDirection,
  setEditDirection,
}) {
  const isOwe = d.direction === "owe";
  const color = settled ? "#6B6B6B" : isOwe ? "#B23A2E" : "#00734D";
  const bg = settled ? "#F0F0F0" : isOwe ? "#FFE5E3" : "#E4F7EF";
  const border = settled ? "#E5E5E5" : isOwe ? "#FFB3AD" : "#9EE3C6";

  if (isEditing) {
    return (
      <div
        style={{
          background: "#FFF9EC",
          border: "1px solid #FFC93C",
          borderRadius: 0,
          padding: "10px 12px",
          marginBottom: 8,
        }}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "flex", gap: 6 }}>
            <button
              onClick={() => setEditDirection("owe")}
              style={{
                flex: 1,
                background: editDirection === "owe" ? "#FF3B30" : "#F0F0F0",
                color: editDirection === "owe" ? "#fff" : "#6B6B6B",
                border: "none",
                borderRadius: 0,
                padding: "7px",
                fontSize: 11.5,
                fontWeight: 700,
              }}
            >
              أنا مدين
            </button>
            <button
              onClick={() => setEditDirection("owed")}
              style={{
                flex: 1,
                background: editDirection === "owed" ? "#00B37E" : "#F0F0F0",
                color: editDirection === "owed" ? "#fff" : "#6B6B6B",
                border: "none",
                borderRadius: 0,
                padding: "7px",
                fontSize: 11.5,
                fontWeight: 700,
              }}
            >
              لي عندهم
            </button>
          </div>
          <input value={editPerson} onChange={(e) => setEditPerson(e.target.value)} placeholder="اسم الشخص" style={inputStyle} />
          <input
            type="number"
            value={editAmount}
            onChange={(e) => setEditAmount(e.target.value)}
            placeholder="المبلغ"
            style={inputStyle}
          />
          <div style={{ display: "flex", gap: 6 }}>
            <button
              onClick={() => onSaveEdit(d.id)}
              style={{ flex: 1, background: "#111111", color: "#fff", border: "none", borderRadius: 0, padding: "8px", fontSize: 12, fontWeight: 700 }}
            >
              حفظ
            </button>
            <button
              onClick={onCancelEdit}
              style={{ flex: 1, background: "#F0F0F0", color: "#6B6B6B", border: "none", borderRadius: 0, padding: "8px", fontSize: 12, fontWeight: 700 }}
            >
              إلغاء
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        background: bg,
        border: `1px solid ${border}`,
        borderRadius: 0,
        padding: "10px 12px",
        marginBottom: 8,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {isOwe ? <ArrowUpRight size={16} color={color} /> : <ArrowDownRight size={16} color={color} />}
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#111111" }}>{d.person}</div>
          <div style={{ fontSize: 11, color }}>
            {settled ? "تم التسديد" : isOwe ? "أنا مدين له" : "له عندي دين"}
          </div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 13, color }}>
          {d.amount.toLocaleString()} ر.س
        </span>
        {!settled && (
          <button
            onClick={() => onSettle(d.id)}
            style={{
              background: color,
              color: "#fff",
              border: "none",
              borderRadius: 0,
              padding: "5px 8px",
              fontSize: 11,
              fontWeight: 700,
            }}
          >
            سُدد
          </button>
        )}
        {!settled && (
          <button
            onClick={() => onStartEdit(d)}
            style={{ background: "none", border: "1px solid #E5E5E5", borderRadius: 0, padding: 5, display: "flex" }}
          >
            <Pencil size={12} color="#6B6B6B" />
          </button>
        )}
        <button
          onClick={() => onDelete(d.id)}
          style={{ background: "none", border: "1px solid #FFB3AD", borderRadius: 0, padding: 5, display: "flex" }}
        >
          <X size={12} color="#FF3B30" />
        </button>
      </div>
    </div>
  );
}

function LoanRow({
  l,
  paid,
  onPay,
  onDelete,
  isEditing,
  onStartEdit,
  onCancelEdit,
  onSaveEdit,
  editBank,
  setEditBank,
  editAmount,
  setEditAmount,
  editMonthly,
  setEditMonthly,
  editDay,
  setEditDay,
}) {
  const isCard = l.type === "card";

  if (isEditing) {
    return (
      <div
        style={{
          background: "#FFF9EC",
          border: "1px solid #FFC93C",
          borderRadius: 0,
          padding: "10px 12px",
          marginBottom: 8,
        }}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <input
            value={editBank}
            onChange={(e) => setEditBank(e.target.value)}
            placeholder="اسم البنك"
            style={inputStyle}
          />
          <div style={{ display: "flex", gap: 6 }}>
            <input
              type="number"
              value={editAmount}
              onChange={(e) => setEditAmount(e.target.value)}
              placeholder="المبلغ المتبقي"
              style={{ ...inputStyle, flex: 1 }}
            />
            <input
              type="number"
              value={editMonthly}
              onChange={(e) => setEditMonthly(e.target.value)}
              placeholder="القسط الشهري"
              style={{ ...inputStyle, flex: 1 }}
            />
          </div>
          <input
            type="number"
            min={1}
            max={31}
            value={editDay}
            onChange={(e) => setEditDay(e.target.value)}
            placeholder="يوم الاستحقاق"
            style={inputStyle}
          />
          <div style={{ display: "flex", gap: 6 }}>
            <button
              onClick={() => onSaveEdit(l.id)}
              style={{
                flex: 1,
                background: "#111111",
                color: "#fff",
                border: "none",
                borderRadius: 0,
                padding: "8px",
                fontSize: 12,
                fontWeight: 700,
              }}
            >
              حفظ
            </button>
            <button
              onClick={onCancelEdit}
              style={{
                flex: 1,
                background: "#F0F0F0",
                color: "#6B6B6B",
                border: "none",
                borderRadius: 0,
                padding: "8px",
                fontSize: 12,
                fontWeight: 700,
              }}
            >
              إلغاء
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        background: paid ? "#E4F7EF" : "#fff",
        border: `1px solid ${paid ? "#9EE3C6" : "#E5E5E5"}`,
        borderRadius: 0,
        padding: "10px 12px",
        marginBottom: 8,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div
          style={{
            width: 30,
            height: 30,
            borderRadius: "50%",
            background: isCard ? "#5B8DEF" : "#FF6B35",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexShrink: 0,
          }}
        >
          {isCard ? <CreditCard size={14} color="#fff" /> : <Landmark size={14} color="#fff" />}
        </div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#111111" }}>
            {l.bank}
            <span style={{ fontSize: 10.5, fontWeight: 600, color: "#6B6B6B" }}>
              {" "}
              — {isCard ? "بطاقة ائتمان" : "قرض"}
            </span>
          </div>
          <div style={{ fontSize: 11, color: "#6B6B6B" }}>
            {paid ? "تم دفع القسط" : `القسط يستحق يوم ${l.dueDay}`} · متبقي {l.amount.toLocaleString()} ر.س
          </div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 13, color: "#111111" }}>
          {l.monthlyPayment.toLocaleString()} ر.س
        </span>
        {!paid && (
          <button
            onClick={() => onPay(l.id)}
            style={{
              background: "#00B37E",
              color: "#fff",
              border: "none",
              borderRadius: 0,
              padding: "5px 8px",
              fontSize: 11,
              fontWeight: 700,
            }}
          >
            دفعت
          </button>
        )}
        <button
          onClick={() => onStartEdit(l)}
          style={{
            background: "none",
            border: "1px solid #E5E5E5",
            borderRadius: 0,
            padding: 5,
            display: "flex",
          }}
        >
          <Pencil size={12} color="#6B6B6B" />
        </button>
        <button
          onClick={() => onDelete(l.id)}
          style={{
            background: "none",
            border: "1px solid #FFB3AD",
            borderRadius: 0,
            padding: 5,
            display: "flex",
          }}
        >
          <X size={12} color="#FF3B30" />
        </button>
      </div>
    </div>
  );
}

function RecurringRow({
  r,
  overdue,
  paid,
  onPay,
  onDelete,
  isEditing,
  onStartEdit,
  onCancelEdit,
  onSaveEdit,
  editLabel,
  setEditLabel,
  editAmount,
  setEditAmount,
  editCat,
  setEditCat,
  editFrequency,
  setEditFrequency,
  editDay,
  setEditDay,
  editMonth,
  setEditMonth,
  editNote,
  setEditNote,
}) {
  const c = CATS[r.cat];
  const Icon = c.icon;

  let dueText = "";
  if (paid) {
    dueText = "تم الدفع";
  } else if (r.frequency === "monthly") {
    dueText = (overdue ? "متأخر — " : "") + `يستحق يوم ${r.dueDay} كل شهر`;
  } else if (r.frequency === "yearly") {
    dueText = (overdue ? "متأخر — " : "") + `يستحق ${r.dueDay} ${MONTH_NAMES[r.dueMonth - 1]} كل سنة`;
  } else {
    dueText = r.note || "استحقاق غير دوري";
  }

  if (isEditing) {
    return (
      <div
        style={{
          background: "#FFF9EC",
          border: "1px solid #FFC93C",
          borderRadius: 0,
          padding: "10px 12px",
          marginBottom: 8,
        }}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <input value={editLabel} onChange={(e) => setEditLabel(e.target.value)} placeholder="الاسم" style={inputStyle} />
          <div style={{ display: "flex", gap: 6 }}>
            <input
              type="number"
              value={editAmount}
              onChange={(e) => setEditAmount(e.target.value)}
              placeholder="المبلغ"
              style={{ ...inputStyle, flex: 1 }}
            />
            <select value={editCat} onChange={(e) => setEditCat(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
              {CAT_KEYS.map((k) => (
                <option key={k} value={k}>
                  {CATS[k].label}
                </option>
              ))}
            </select>
          </div>

          <div style={{ display: "flex", gap: 6 }}>
            {[
              { key: "monthly", label: "شهري" },
              { key: "yearly", label: "سنوي" },
              { key: "other", label: "أخرى" },
            ].map((f) => (
              <button
                key={f.key}
                onClick={() => setEditFrequency(f.key)}
                style={{
                  flex: 1,
                  background: editFrequency === f.key ? "#111111" : "#F0F0F0",
                  color: editFrequency === f.key ? "#fff" : "#6B6B6B",
                  border: "none",
                  borderRadius: 0,
                  padding: "7px 4px",
                  fontSize: 11,
                  fontWeight: 700,
                }}
              >
                {f.label}
              </button>
            ))}
          </div>

          {editFrequency === "monthly" && (
            <input
              type="number"
              min={1}
              max={31}
              value={editDay}
              onChange={(e) => setEditDay(e.target.value)}
              placeholder="يوم الاستحقاق (1-31)"
              style={inputStyle}
            />
          )}
          {editFrequency === "yearly" && (
            <div style={{ display: "flex", gap: 6 }}>
              <input
                type="number"
                min={1}
                max={31}
                value={editDay}
                onChange={(e) => setEditDay(e.target.value)}
                placeholder="اليوم"
                style={{ ...inputStyle, flex: 1 }}
              />
              <select value={editMonth} onChange={(e) => setEditMonth(e.target.value)} style={{ ...inputStyle, flex: 1.4 }}>
                {MONTH_NAMES.map((m, i) => (
                  <option key={m} value={i + 1}>
                    {m}
                  </option>
                ))}
              </select>
            </div>
          )}
          {editFrequency === "other" && (
            <input
              value={editNote}
              onChange={(e) => setEditNote(e.target.value)}
              placeholder="مثال: كل 3 أشهر"
              style={inputStyle}
            />
          )}

          <div style={{ display: "flex", gap: 6 }}>
            <button
              onClick={() => onSaveEdit(r.id)}
              style={{ flex: 1, background: "#111111", color: "#fff", border: "none", borderRadius: 0, padding: "8px", fontSize: 12, fontWeight: 700 }}
            >
              حفظ
            </button>
            <button
              onClick={onCancelEdit}
              style={{ flex: 1, background: "#F0F0F0", color: "#6B6B6B", border: "none", borderRadius: 0, padding: "8px", fontSize: 12, fontWeight: 700 }}
            >
              إلغاء
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        background: overdue ? "#FFE5E3" : "#fff",
        border: `1px solid ${overdue ? "#FFB3AD" : "#E5E5E5"}`,
        borderRadius: 0,
        padding: "10px 12px",
        marginBottom: 8,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div
          style={{
            width: 30,
            height: 30,
            borderRadius: "50%",
            background: overdue ? "#FF3B30" : c.color,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexShrink: 0,
          }}
        >
          <Icon size={14} color="#fff" />
        </div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#111111" }}>{r.label}</div>
          <div style={{ fontSize: 11, color: overdue ? "#FF3B30" : "#6B6B6B", fontWeight: overdue ? 700 : 400 }}>
            {dueText}
          </div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 13, color: "#111111" }}>
          {r.amount} ر.س
        </span>
        {!paid && (
          <button
            onClick={() => onPay(r.id)}
            style={{
              background: overdue ? "#FF3B30" : "#00B37E",
              color: "#fff",
              border: "none",
              borderRadius: 0,
              padding: "5px 8px",
              fontSize: 11,
              fontWeight: 700,
            }}
          >
            دفعت
          </button>
        )}
        <button
          onClick={() => onStartEdit(r)}
          style={{ background: "none", border: "1px solid #E5E5E5", borderRadius: 0, padding: 5, display: "flex" }}
        >
          <Pencil size={12} color="#6B6B6B" />
        </button>
        <button
          onClick={() => onDelete(r.id)}
          style={{ background: "none", border: "1px solid #FFB3AD", borderRadius: 0, padding: 5, display: "flex" }}
        >
          <X size={12} color="#FF3B30" />
        </button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
